# auto-CWI configuration.

# Speaker -> color, assigned deterministically by order of first appearance.
palette:
  - "#E5E517"   # CI Main Yellow
  - "#17E517"   # CI Main Green
  - "#17E5E5"   # CI Main Blue
  - "#E517E5"   # CI Main Pink
  - "#E51717"   # CI Main Red
  - "#E58017"   # CI Main Orange
# CI Supporting colors (2.1.2), used for speakers 7+.
palette_support:
  - "#E85C2E"
  - "#EBC247"
  - "#C2EB47"
  - "#82ED5E"
  - "#47EB70"
  - "#5EEDC9"
  - "#47C2EB"
  - "#5E82ED"
  - "#8C6BED"
  - "#CC6BED"
  - "#EB47C2"
  - "#ED5E82"

# Light-stage speaker colors.
palette_light:
  - "#76760C"   # from CI Main Yellow #E5E517   4.60:1
  - "#0D840D"   # from CI Main Green  #17E517   4.65:1
  - "#0D7F7F"   # from CI Main Blue   #17E5E5   4.61:1
  - "#C714C7"   # from CI Main Pink   #E517E5   4.62:1
  - "#E11717"   # from CI Main Red    #E51717   4.63:1
  - "#AA5F11"   # from CI Main Orange #E58017   4.61:1
# Supporting colors (2.1.2) for speakers 7+, same derivation.
palette_support_light:
  - "#C14D26"   # from #E85C2E   4.61:1
  - "#876F29"   # from #EBC247   4.63:1
  - "#657A25"   # from #C2EB47   4.60:1
  - "#467F33"   # from #82ED5E   4.63:1
  - "#27823E"   # from #47EB70   4.62:1
  - "#327E6B"   # from #5EEDC9   4.64:1
  - "#2D7A94"   # from #47C2EB   4.65:1
  - "#4F6DC7"   # from #5E82ED   4.63:1
  - "#7B5ED1"   # from #8C6BED   4.60:1
  - "#9D52B6"   # from #CC6BED   4.66:1
  - "#C03A9F"   # from #EB47C2   4.62:1
  - "#BC4B67"   # from #ED5E82   4.63:1

# The Captions Box (2.4.1): black at 90% opacity, hugging each caption line,
# overlaid on the video inside the work area (lower 20% of the frame, 2.4.3).
caption_box:
  color: "#000000"
  opacity: 0.9
  bottom_margin_pct: 7.5      # bottom safety margin, % of video height
  max_lines: 2

# The Read-Ahead Type (2.2.1): each line appears whole in white at 90% opacity;
# words flip to the speaker color at their exact spoken onset (2.2.2).
read_ahead:
  color: "#FFFFFF"
  opacity: 0.9
  # 2.2.1's white is specified against 2.4.1's 90%-black captions box, and
  # the light stage deliberately has no box.
  color_light: "#6E6E73"

# What reaches the stage, and for how long.
display:
  # The static Next.js export is the product UI.
  frontend: next
  # `fast` is the normal live mode: the accurate stream's current white tail
  # appears before it is locked, then settles in place.
  mode: fast
  # Stacked live transcript: new text-hugging boxes grow upward from the bottom.
  align: left             # left | center
  retention: overflow     # lines accumulate; pushed off the top only when full
  # A quiet, non-text voice indicator follows the active speaker's line.
  intent_circle: true
  intent_circle_size_pct: 2.3
  intent_circle_volume_db: [-60, -15]
  intent_circle_pitch_hz: [80, 250]
  intent_circle_brightness_hz: [500, 3500]
  intent_circle_smoothing: 0.24
  # The diagnostics/legacy box uses an eight-word visual block.
  max_words: 8
  studio_paragraph_word_limit: 0  # 0 = unlimited; split only on speaker change
  studio_stage_paragraph_history: 6   # fallback; the stage measures its own
  studio_stack_words_per_block: 11    # max words per row, not the row width
  studio_stack_words_min: 3           # below three a row stops reading as a phrase
  # Rows the stack must fit before it prefers shorter rows and larger type.
  studio_stack_min_rows: 16
  # Dead for the studio stage — overlapping pops are the design working. Still
  # read by the legacy diagnostics page (`livepage.py`), so it is not removable.
  max_simultaneous_reveals: 3
  word_reveal_gap_s: 0.14
  word_reveal_gap_min_s: 0.08
  word_reveal_gap_max_s: 0.26
  word_reveal_timing_strength: 0.75
  word_reveal_catchup_gap_s: 0.06
  # CWI 2.2.1: the line is on screen before it is spoken. The delay sets the
  # MEAN lead; the floor is what every individual word is guaranteed, because
  # the recognizer releases words in bursts. Nothing is predicted.
  read_ahead_delay_s: 1.75
  min_read_ahead_ms: 420
  # CWI 2.1. How long a word's colour stays revisable after it FIRST gets a
  # speaker -- not after it appears, because `speaker: null` is grey and
  # attribution lands at a median 4.48s against text at 0.62s, so an
  # arrival-keyed window would freeze most words grey. Past this the endpoint
  # pass may still correct the tracker; it just may not repaint a line the
  # viewer has already read and attributed. Set to 0 to disable.
  #
  # 6.0s covers the measured attribution lag (durable at 4.48s, endpoint
  # verification at 1.1-3.2s) with headroom, so a genuine correction still
  # lands. Raise it if real corrections are being refused; lower it if colour
  # still changes under the eye. DISPLAY ONLY -- `SpeakerTracker` and every
  # attribution probe see the unfrozen answer, because colour STABILITY and
  # colour CORRECTNESS are separate questions and this moves only the first.
  speaker_color_lock_s: 6.0
  # How long the compass arrow takes to cover ~63% of a change in bearing.
  # `direction_deg` arrives every level_event_period_s (~120 ms) and the array
  # HOLDS its last bearing while the room is quiet, so the raw channel is flat
  # stretches broken by steps -- which reads as "sits still, then jumps".
  # A LONGER CSS TRANSITION DOES NOT FIX THIS: measured on the level channel
  # 2026-08-13, a 340 ms ease against a 120 ms event period never converges and
  # the mark just chases. The value has to be smoothed before it reaches CSS.
  # 0 disables. UNMEASURED against a real room -- raise it if the arrow still
  # jumps, lower it if it lags the talker. Judge the MEDIAN frame-to-frame step,
  # not the p90: the p90 is genuine speaker changes, which the dial should show.
  compass_bearing_tau_ms: 400
  # The dial's second-talker beam marks. OFF since 2026-09-07, because the
  # 4-beam read they come from is not trustworthy on this board: measured
  # directly, AEC_SPENERGY_VALUES and AEC_AZIMUTH_VALUES return each other's
  # payloads and values orders of magnitude out of range (669931 for an energy
  # capped at 1000; 229120 for a value in radians), and the 4-beam table
  # alternates 0-live/4-live on exactly every other read -- the artifact
  # docs/HARDWARE.md describes, not four beams.
  # The single DOA_VALUE survives the same unreliability because it is one
  # range-checked scalar re-polled ~8x/sec; a 4-value table does not.
  # THE DANGER IS THE PLAUSIBLE ONES: [0.0, 0.203, 1.479, 3.193] passes the
  # range check while being the wrong command's payload, so the dial draws a
  # confident line at a second talker who is not there -- which is exactly what
  # "a corrupt read must become an absent field, never a confident one"
  # forbids. Turn back on only after the control read is fixed AND two real
  # simultaneous talkers have been measured.
  compass_beams_enabled: false
  intonation_envelope_samples: 8   # readings of a word's own audio, per word
  word_motion_duration_s: 0.42
  word_motion_max_duration_s: 1.05
  word_motion_span_stretch: 0.42
  word_motion_pop_max_duration_s: 0.70   # the 2.2.3 pop's ceiling
  # 0.52, not the 0.32 the reference fits: raised three times because the
  # motion read as too fast. A deliberate deviation, flagged rather than hidden.
  word_motion_min_duration_s: 0.52

  word_motion_follows_speech: false   # tried; the clock stays on speech RATE
  word_motion_speech_scale: 1.5   # animation seconds per second of speech
  word_motion_speech_floor_s: 0.30   # below this an animation is a flicker
  # A speculative first phone must outlive its own revision.
  onset_motion_duration_s: 0.68
  word_motion_source_span_s: 0.14   # normalises decoder word lengths
  word_reveal_fade_s: 0.22
  line_break_gap_s: 2.0   # silence that forces a new line
  line_linger_s: 9.0      # linger retention only: how long a line stays
  # 2.4.4/2.4.5: a sound label yields to speech, never sits beside it.
  sound_label_speech_linger_s: 0.8
  sentence_stagger_s: 0.7   # sentence mode: gap between revealed turns
  # Once a word's one-time motion window ends, its geometry and font axes
  # are SETTLED forever.
  stability: corrections
  # window.__cwiChurn.report() in the browser console: post-paint mutations
  # per settled word. Should be ~0 except colour<=1 and genuine corrections.
  debug_churn: false
  # Opt-in per-second renderer diagnostics.
  debug_render: false
  diagnostic_interval_s: 1.0
  # Hard cap for the per-word animation-frame queue.
  render_queue_limit: 512
# Guiding The Eye With Motion.
motion:
  elevation_em: 0.25          # -amp in the template's Position 3D expression
  # "Antecipate" lead.
  anticipation_ms: 33
  neighbor_bleed: 0.0         # partial lift on the next, unspoken word
  color_turn_ms: 90           # color eases with the lift, never a hard cut
  duration_s: 0.56
  min_duration_s: 0.42
  max_duration_s: 0.90
  easing: cubic-bezier(0.22, 0.78, 0.24, 1)
  # 2.2.4 syllable variation: the colour crosses a drawn-out word in parts.
  # It is a wipe over visible text, never a typewriter reveal -- progressive
  # appearance would destroy 2.2.1's read-ahead.
  syllable_fill:
    enabled: true
    min_duration_s: 0.32     # below this, a word is not "drawn out"
    min_syllables: 2         # needs >=2 distinct sub-word onsets

  # Live and `cc` share one motion engine (autocwi/cwi_motion_core.js).
  live_sync:
    enabled: true
    # These are the LEGACY diagnostics renderer's values.
    sync_pop: 0.10
    sync_elevation_em: 0.20
    rise_s: 0.18              # slower attack; avoids the angry jab
    peak_s: 0.14              # calm, readable emphasis
    fall_s: 0.34              # longer release back to rest
    # Font variation exists only inside the motion window.
    size_response: 0.78
    prosody_strength: 0.78
    min_emphasis_scale: 0.78
    max_emphasis_scale: 1.34
    pitch_response: 1.0
    width_response: 0.75
    font_weight_strength: 1.70
    # Active words may travel beyond the calm transcript's 280..500 band.
    active_weight_range: [180, 700]
    font_width_strength: 0.90
    # Do not drive every type axis with one generic pulse.
    size_attack_fraction: 0.42
    size_hold_fraction: 0.62
    weight_attack_fraction: 0.30
    weight_hold_fraction: 0.48
    weight_release_fraction: 0.90
    width_attack_fraction: 0.50
    width_hold_fraction: 0.68
    width_release_fraction: 0.96
    # Acoustic word duration already stretches the complete 520–720 ms
    # clock.
    slow_delivery_curve_delay: 0.06
    # Loud words rise farther; quiet words stay closer to the baseline.
    lift_base_gain: 0.82
    lift_prosody_gain: 2.8
    lift_min_gain: 0.28
    lift_max_gain: 1.40
    emphasis_deadband: 0.02
    character_wave_enabled: true
    # Strong enough to read as the synchronization reference's travelling
    # alphabet ribbon, while staying upward-only and neighbour-smoothed.
    character_wave_lift_em: 0.085
    # POP is the channel still under the reference.
    character_wave_pop: 0.05
    character_wave_crouch_em: 0.0
    character_wave_lead_s: 0.18
    character_wave_peak_s: 0.18
    character_wave_fall_s: 0.48
    character_wave_spatial_smoothing: 0.72
    # Virtual spacing between character turns.
    character_wave_step_s: 0.18
    character_wave_max_span_s: 2.20
    # Live speech is commonly faster than authored CC.
    fast_speech_motion_gain: 0.58
    # Delivery shapes the path without leaving a persistent style behind.
    delivery_enabled: true
    # WEIGHT IS THE CHANNEL THAT WAS DOING THE LEAST, MEASURED (2026-07-30).
    weight_range: [100, 900]
    # Slow flow may use more of the existing window but never exceed the global
    # 720 ms cap; the next fresh word remains hidden until a slot opens.
    delivery_flow_duration_ms: 90
    delivery_min_confidence: 0.38
    # THE NEXT STUDIO'S MOTION, STRICTLY FROM THE DESIGN SYSTEM PDF.
    studio:
      # 2.2.3, verbatim: "a 15% increase in type size before returning to
      # its original size".
      sync_pop: 0.15
      # ...AND THE PR FILM DOES NOT RENDER 15%.
      sync_pop_enhanced: 0.076
      # THE POP IS PROPORTIONAL TO EMPHASIS, NOT A FIXED STEP (2026-08-20).
      # It used to be a constant: a word either took the whole of
      # `sync_pop_enhanced` or exactly nothing, decided by `quietWord`. That is
      # a binary gate on a continuous quantity, and it makes the band the film
      # actually lives in unreachable -- measured across assets/reference_specs,
      # 90% of words move and 60% of them land between 1.02x and 1.15x, which a
      # flat 7.6% step cannot produce at ANY gate threshold. Both failure modes
      # came from it: too many identical big pops before, and 79% of words with
      # no size motion at all after the gate was tightened.
      # This is the floor of that proportion -- what an UNEMPHASISED word gets,
      # as a fraction of the full pop. The most emphatic word gets 1.0.
      # Fitted against the reference band distribution (8/60/25/6 percent):
      # at 0.0 the L1 error is 116, at 0.5 it is 22, and 0.35..0.8 are flat, so
      # this is the middle of a plateau rather than a sharp optimum.
      sync_pop_floor_enhanced: 0.5
      # How long the enhanced size cue lasts, end to end.
      word_lift_em_enhanced: 0.16
      word_motion_enhanced_ms: 424
      # ...FOR AN UNEMPHASISED WORD.
      word_motion_enhanced_emphasis_ms: 626
      # How long AFTER the colour turn the size cue starts.
      crest_lag_ms: 0
      # A WORD THAT WAITS RISES, AND LANDS AS IT TURNS.
      character_wave_falloff: 1.0
      # ...and no floor, for the same reason.
      character_wave_floor: 0.0
      hold_lift_em: 0.525      # how far a held word leaves the line
      # RE-BASED ONTO THE INTER-ONSET INTERVAL (2026-08-03).
      hold_full_s: 0.88        # interval at which the lift reaches its maximum
      hold_min_s: 0.78         # below this a word is ordinary speech: no lift
      # ...and ABOVE this it is a sentence break, which the film does not
      # lift either.
      hold_max_s: 1.06         # above this the silence is a sentence break
      # Crouch + launch + float, i.e. everything BEFORE the landing.
      hold_pre_ms: 260
      # The plateau at full lift, between the colour turn and the descent.
      hold_hold_ms: 420
      hold_land_ms: 290        # how long the descent onto the baseline takes
      # 2.3's swell HOLDS, it does not just peak.
      voice_scale_range: [0.72, 1.62]
      # How much of the 2.3.6 excursion survives, applied ABOUT the baseline
      # so 2.3.5's anchor is exact at any value.
      voice_scale_response: 1.0
      # ...and the QUIET half, deliberately gentler.
      voice_scale_response_quiet: 0.92
      # A band around the median where size does not move at all, as a
      # fraction of each side -- the pivot is not centred. Without it, half of
      # all ordinary words drew below normal and read as instability.
      voice_scale_deadband: 0.34
      # ENHANCED USES A NARROWER BAND.
      voice_scale_deadband_enhanced: 0.0
      # TRIED AND REVERTED: a continuous loudness ramp (`scalePivot: 0`)
      # with a softened slope.
      voice_scale_response_enhanced: 0.50
      # WHERE THE ENHANCED SIZE MAPPING PIVOTS.
      voice_scale_pivot_enhanced: 0.10
      # CONVEXITY of the enhanced ramp.
      voice_scale_curve_enhanced: 2.0
      # THE FITTED LOUDNESS -> SIZE CURVE, and it replaces the three knobs
      # above on the enhanced clock.
      voice_scale_points_enhanced:
        # REFITTED 2026-08-12 against a CORRECTED film measurement.
        # THE KNEE MOVED TO 0.41 ON 2026-08-20 AND WAS PUT BACK THE SAME DAY.
        # Moving it did cut the pop rate 41.5% -> 20.8%, but it bought that by
        # sending 79% of words to EXACTLY 1.000 -- no size motion at all -- and
        # the reference does the opposite: measured across the four reference
        # specs, 90% of words move and only 12% exceed 1.20x. The mass sits in
        # a SMALL pop, which no knee position can reach while the pop amplitude
        # is a constant. The knee was the wrong knob; `sync_pop_floor_enhanced`
        # below is the right one. See docs/MOTION.md.
        - [0.00, 0.000]
        - [0.21, 0.000]
        - [0.30, 0.107]
        - [0.45, 0.222]
        - [0.65, 0.303]
        - [1.00, 0.425]
      # 2.3.8: 160-200 Hz is Regular 400, a BAND rather than a pivot, so
      # ordinary F0 jitter moves nothing. 2.3.9: low voices heavier.
      weight_range: [340, 900]
      weight_emphasis: 0.92    # what an emphasised word adds on top
      # 2.3.9/2.3.10: rich low harmonics read wider, thin high harmonics
      # condensed.
      width_range: [82, 124]

    # ENABLED FOR THE STUDIO 2026-08-01.
    neighbor_push: false      # legacy renderer only; the studio pushes in CSS
    # Open-caption adaptation: a word cannot be visible before ASR supplies
    # it, so its first paint is its visual activation.
    display_on_create: true
    # Optional per-character slide-in on a word's first paint.
    character_entry_enabled: false
    character_entry_duration_s: 0.24
    character_entry_stagger_s: 0.018
    character_entry_slide_em: 0.22
    character_entry_rise_em: 0.08
    character_entry_start_scale: 0.92
    character_entry_start_opacity: 0.0
    # Media-source seconds -> browser performance-time clock mapping.
    clock_smoothing: 0.18
    clock_reset_threshold_s: 0.75

# Live caption mode (`python -m autocwi live`): microphone -> true streaming
# language-specific ASR -> CWI-styled captions in the browser.
live:
  lang: en
  port: 7337
  # Language-independent acoustic delivery descriptors.
  delivery:
    enabled: true
    frame_s: 0.064
    hop_s: 0.032
    context_s: 0.064
    pitch_confidence_min: 0.32
    # Contour is intentionally conservative.
    contour_full_scale_semitones: 7.0
    contour_min_voiced_frames: 5
    contour_min_voiced_fraction: 0.30
    contour_octave_filter_ratio: 1.60
    attack_full_scale_db: 12.0
    texture_brightness_hz: [700, 4200]
    realtime_smoothing: 0.28
    profile:
      min_confidence: 0.38
      contour_threshold: 0.45
      gentle_force_max: 0.18
      gentle_attack_max: 0.24
      # Absolute recording level alone cannot mean "gentle" (the entire Korean
      # fixture is quiet). Require a breathy/aperiodic texture too.
      gentle_texture_min: 0.60
      forceful_force_min: 0.75
      sustained_flow_min: 0.82
      sustained_duration_s: 0.44
      textured_min: 0.80
  # With no --lang override, the Next.js studio asks for this capture's
  # language before any recognizer loads or microphone/file capture starts.
  languages:
    en:
      label: English
      native_label: English
      description: Nemotron streaming ASR with Parakeet endpoint verification
      model_label: 1120ms Nemotron accurate stream
    ko:
      label: Korean
      native_label: 한국어
      description: Nemotron 3.5 multilingual streaming ASR, pinned to Korean
      model_label: Nemotron 3.5 ASR 0.6B · 1120ms · ko
      # SWAPPED OFF THE 174M ZIPFORMER 2026-08-21, ON RECALL NOT ACCURACY.
      # The complaint was that Korean "cannot catch" speech, so the deciding
      # column is DELETIONS -- units the model never emitted -- which
      # `scripts/benchmark.py` now reports beside CER. Measured on 50 FLEURS ko
      # clips, Zipformer -> this model:
      #   clean            del 3.88% -> 1.47%,  CER  9.64% ->  7.01%
      #   room-noise 14dB  del 5.35% -> 2.81%,  CER 16.02% -> 12.18%
      #   fast 1.15x       del 25.70% -> 5.80%, CER 51.85% -> 18.38%
      # The fast-speech column is why this shipped: FLEURS is slow read
      # narration and the Zipformer was dropping a QUARTER of all words once
      # speech ran 15% quicker, which is nearer a real speaking rate.
      # Full 120-clip clean CER: 10.54% -> 7.52% pinned (7.70% auto-detecting),
      # deletions 3.01%, coverage 0.974, 0/120 clips silent. It also beats
      # the 7.94% the Whisper endpoint verifier bought at 8.6x RTF -- in the
      # stream, keeping native word spans, with no revision lane added.
      # NOT a fix for a silent stage: under `quiet-device` BOTH models go
      # silent on ~19-20 of 50 clips, because `InputGain` never calls sub-8dB-
      # SNR audio speech and so never gains it. That is a microphone problem;
      # see docs/DECISIONS.md and scripts/mic_probe.py.
      # REVERTING is this block alone: restore `streaming_model_dir`,
      # `streaming_files` and drop `streaming_language`. The 174M export is
      # still on disk under assets/streaming-zipformer-ko-174m.
      streaming_model_dir: assets/streaming-nemotron35-multi-1120ms
      # THE LANGUAGE IS PER STREAM, NOT PER RECOGNIZER -- the multilingual
      # encoder takes a 6th input (`prompt_index`) and `_new_stream` applies it
      # at EVERY stream creation, including the reset after each endpoint.
      # PINNED rather than `auto`: naming the language wins on every measured
      # condition, and on fast speech it is worth 4.2 CER points
      # (22.58% -> 18.38%) and 1.9 points of deletions (7.72% -> 5.80%).
      streaming_language: ko
      # RECALL OVER CORRECTNESS, DELIBERATELY (see the root note). Swept on 60
      # FLEURS ko clips:
      #   0.0  CER 8.45%  del 2.63%  ins 0.48%  cov 0.978
      #   2.0  CER 7.93%  del 2.11%  ins 0.52%  cov 0.984   <- free win
      #   3.0  CER 8.71%  del 1.71%  ins 1.63%  cov 0.999   <- shipped
      #   4.0  CER 11.68% del 1.30%  ins 4.34%  cov 1.030
      # 3.0 costs 0.26 CER points against the baseline and drops 35% of the
      # DELETIONS, taking coverage to 0.999 -- the same amount of speech
      # transcribed. 4.0 is where insertions start inventing text.
      blank_penalty: 3.0
      # CWI 2.2.1 NEEDS A BIGGER BUDGET ON THIS MODEL (measured 2026-09-04).
      # The global 1.75 s delivers 488 ms of read-ahead on English and **0 ms**
      # here: the 1120 ms multilingual chunk plus the endpoint hold-back spends
      # the whole budget, so the playhead reaches every word the instant it
      # arrives and the line is never legible before it is spoken. At 3.20 s
      # this profile delivers **583 ms**, which is the English figure's order.
      # `scripts/studio_probe.py --url ...` is the check; it prints the number
      # and fails loudly when 2.2.1 is not being delivered.
      display:
        read_ahead_delay_s: 3.20
      draft_enabled: false
      # STAYS OFF, AND THE REASON IS NOW READ-AHEAD, NOT ACCURACY.
      # Measured 2026-09-04 on 120 FLEURS ko clips, this verifier is a real
      # accuracy win: CER 7.52% -> 4.97% normalized (12.33% -> 7.57% raw), with
      # SUBSTITUTIONS nearly halved, 4.14% -> 2.15% -- the error class users
      # report as "it gets the word wrong". Deletions and coverage also improve
      # slightly. The old reason for `false` (a 2024 model once changed a
      # correct phrase, judged on four utterances) does not survive that.
      # BUT IT COSTS THE THING THE DESIGN SYSTEM IS FOR. Read-ahead, measured
      # through live playback with `scripts/studio_probe.py`:
      #   delay 1.75s  verifier off    0 ms   FAIL
      #   delay 1.75s  verifier on    47 ms   FAIL
      #   delay 3.20s  verifier off  583 ms   OK
      #   delay 3.20s  verifier on   191 ms   FAIL
      # At the budget that makes 2.2.1 work, the endpoint pass takes 583 ms
      # down to 191. Better text with no read-ahead is the chunk-64 trade this
      # project already refuses, and read-ahead is the accessibility feature,
      # not a nicety. RTF 0.217 -> 0.570 and cold start 2.1s -> 8.2s besides.
      # Turn it on only for a use where lag does not matter (captioning a
      # recording), never for the live booth.
      verifier_enabled: false
      verifier_engine: whisper
      verifier_whisper:
        # ~1.6 GB, downloaded once by faster-whisper on first use.
        model: large-v3-turbo
        # CTranslate2 has no MPS backend; CPU int8 is the documented Apple
        # Silicon path.
        device: cpu
        compute_type: int8
        beam_size: 5
        cpu_threads: 4
      # GREEDY IS THE ONLY METHOD THIS MODEL HAS, not a tuning choice, and
      # trying the alternative takes the server down rather than scoring worse:
      # sherpa-onnx's NeMo transducer implementation aborts the process on load
      # with "Unsupported decoding method: modified_beam_search" (verified
      # 2026-09-04 against the shipped 1.13.5). The note that used to sit here
      # -- that greedy beat modified_beam_search on 120 FLEURS clips -- was
      # measured on the 174M Zipformer this replaced on 2026-08-21, and read as
      # an invitation to re-run an A/B that now crashes a booth.
      decoding_method: greedy_search
      # Dead for greedy; kept only for the Zipformer revert path documented
      # above, which does read it.
      streaming_max_active_paths: 8
      # The TIMIT first-phone sidecar maps English phones to English
      # letters.
      onset_prefix:
        enabled: false
      # Korean uses the Chinese-English CAM++ encoder as Sortformer's quiet
      # speech fallback.
      diarization:
        model: assets/speaker-embedding-multilingual/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
      speaker_attribution:
        assignment_threshold: 0.42
        provisional_threshold: 0.30
        new_speaker_threshold: 0.27
        retain_threshold: 0.36
        switch_threshold: 0.42
        short_stable_threshold: 0.28
    multi:
      label: Bilingual
      native_label: 한국어 + English
      description: One model, automatic language detection
      model_label: Nemotron 3.5 ASR 0.6B · 1120ms · auto-detect
      # THE THIRD CAPTURE MODE (2026-08-11).
      streaming_model_dir: assets/streaming-nemotron35-multi-1120ms
      # THE LANGUAGE IS A PER-STREAM OPTION, NOT A RECOGNIZER ARGUMENT.
      streaming_language: auto
      # THE SESSION IS KOREAN + ENGLISH, THE MODEL KNOWS 40 LOCALES. `auto` is
      # re-decided at every endpoint (each reset is a fresh stream), and on
      # short utterances it sometimes picks a neighbour: measured on FLEURS
      # through this profile, ~1% of 2.5 s segments leak Kana on Korean audio
      # (`おいり 사회의 본질`) or Arabic on English audio (`استهلك a dinosau`),
      # always as a prefix the model then recovers from. Words whose letters
      # are MAJORITY outside these scripts are dropped before publication --
      # they are mis-decode noise, not content, so nothing real is lost.
      # Numbers and punctuation are script-neutral and always pass. Only this
      # profile carries the key: the pinned profiles cannot leak.
      allowed_scripts: [hangul, latin]
      # LOWER THAN `ko` BECAUSE ONE VALUE HAS TO SERVE BOTH SCRIPTS. Swept on
      # 50 clips of each set through this profile:
      #   KO  0.0 CER 7.23% del 1.74% cov 0.987 | 2.0 CER 6.43% del 1.07% cov 0.993
      #       3.0 CER 7.94% del 0.80% cov 1.013
      #   EN  0.0 WER 8.97% del 1.21% cov 1.002 | 2.0 WER 9.72% del 0.93% cov 1.008
      #       3.0 WER 14.95% del 0.93% cov 1.050
      # 2.0 is strictly better on Korean (CER and recall both) and costs English
      # 0.75 WER points for 23% fewer deletions. 3.0 is what `ko` ships and is
      # NOT safe here: it takes English to 14.95%.
      blank_penalty: 2.0
      # Same weights, same 1120 ms chunk, same read-ahead problem as `ko`.
      display:
        read_ahead_delay_s: 3.20
      # One authoritative stream.
      draft_enabled: false
      # THE ENGLISH ENDPOINT VERIFIER, GATED TO ENGLISH UTTERANCES (2026-09-04).
      # Off until now, and that made every `multi` vs `en` comparison a
      # comparison of two DIFFERENT PIPELINES rather than of two sets of model
      # weights: `en` inherits this lane, `multi` went without it. MEASURED on
      # 120 FLEURS en_us and 120 FLEURS ko_kr clips:
      #   EN  en profile          5.82% WER  del 0.98%  sub 4.26%
      #   EN  multi, verifier off 8.95% WER  del 1.29%  sub 6.48%
      #   EN  multi, THIS         6.25% WER  del 1.05%  sub 4.69%
      #   KO  ko profile          7.52% CER  del 3.01%  0/120 silent
      #   KO  multi, THIS         7.96% CER  del 3.17%  0/120 silent
      # The lane is worth 2.70 WER points on English and closes 86% of the gap
      # to the dedicated English profile; what it recovers is almost entirely
      # SUBSTITUTIONS, with deletions and coverage near identical either way --
      # the stream hears the words and spells them wrong, which is exactly the
      # error class a whole-phrase pass exists to fix. Korean is unharmed: the
      # residual 0.44 points against the `ko` profile is auto-detect versus
      # pinning, which this profile exists to do and which was already measured.
      # `verifier_latin_only` is what makes it safe: the verifier is an English
      # model that replaces the WHOLE utterance, so any Hangul in the hypothesis
      # disqualifies it. See `_verifier_skips` in live.py -- and note that
      # skipping it also has to select the no-verifier EMISSION path, or the
      # skipped utterance is never finalized at all (that bug measured 120/120
      # Korean clips silent).
      verifier_enabled: true
      verifier_latin_only: true
      decoding_method: greedy_search
      # Korean is the harder script for the shared diarizer, and the
      # multilingual CAM++ embedding is the one that covers both.
      diarization:
        model: assets/speaker-embedding-multilingual/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx
      # The English TIMIT onset sidecar cannot serve a Korean-carrying stream.
      onset_prefix:
        enabled: false
  # Fast model drives revisable white words; accurate model alone locks color
  # and writes durable events. Both run faster than real time on the target M1.
  # RECALL KNOB, PER PROFILE. Subtracted from the blank logit every frame, so a
  # positive value makes the transducer less willing to emit nothing. It buys
  # COVERAGE with insertions, which is the trade this stage wants: a wrong word
  # is a caption, a dropped word is a hole the viewer cannot see and cannot ask
  # about. Swept 2026-09-04 on FLEURS, verifier off on every arm so the column
  # measures what the STREAM emits.
  #   EN on `en`   0.0  WER  8.36%  del 1.52%  cov 1.000
  #                1.0  WER  7.90%  del 1.14%  cov 1.005   <- strictly better
  #                2.0  WER  9.04%  del 0.76%  cov 1.021
  # 1.0 is not a trade at all here: it improves WER AND recall together.
  blank_penalty: 1.0
  draft_model_dir: assets/streaming-nemotron-en-160ms
  streaming_model_dir: assets/streaming-nemotron-en-1120ms
  verifier_model_dir: assets/parakeet-unified-en-offline
  verifier_model_type: nemo_transducer
  # A phoneme CTC sidecar that guesses a word's first letter early. OFF: it
  # fired at the start of every sentence and was ~40% of all visible churn.
  # It is NOT 2.2.1 read-ahead, which is the uncoloured preview of the line.
  onset_prefix:
    enabled: false
    model_dir: assets/phoneme-onset-en
    model_id: bihungba1101/wav2vec2-base-timit-phoneme-demo-google-colab
    hop_s: 0.08
    min_audio_s: 0.22
    synthetic_right_context_s: 0.24
    max_analysis_s: 3.00
    max_prefix_chars: 8
    prefix_stability_updates: 2
    sustain_update_s: 0.12
    min_confidence: 0.60
    activation_db: -50.0
    silence_db: -54.0
    reset_s: 0.45
  streaming_files:
    tokens: tokens.txt
    encoder: encoder.int8.onnx
    decoder: decoder.int8.onnx
    joiner: joiner.int8.onnx
  num_threads: 4
  verifier_num_threads: 4
  verifier_decoding_method: modified_beam_search
  verifier_max_active_paths: 4
  verifier_tail_padding_s: 0.10   # lets the verifier flush its last context
  # `local` = fully offline (default).
  verifier_backend: local
  openai_verifier:
    # Endpoint buffers are complete utterances, so the completed-audio model
    # applies. Text only -- it returns no word timestamps, which is why it can
    # never replace the streaming recognizer.
    model: gpt-transcribe
    timeout_s: 2.0        # bounds the stall: transcribe() blocks the capture path
    min_duration_s: 0.4   # skip the round trip on fragments/false endpoints
    language: null        # null = session language
    prompt: ""            # optional keyword/context hint
    record_disagreements: true
  # Longer verifier phrases retain linguistic context.
  endpoint_silence_s: 1.2
  endpoint_max_s: 30.0
  # Cold-start window only (first 6 words); after that the mapping uses
  # percentiles of the speaker's own word history.
  db_range: [-45, -15]
  # Loudness normalization window, as percentiles of recent word dB.
  db_percentiles: [10, 95]  # [5,95] over-widened: loud words hit 9% and overflowed
  # A FLOOR on the normalization window, so a monotone passage is not
  # amplified into whisper..shout.
  db_min_span: 18.0
  # VOCAL EFFORT, because CWI 2.3.5 asks for VOLUME and `loudness_db` only
  # measures LEVEL.
  vocal_effort:
    enabled: true
    gain: 0.55
    smoothing_words: 6      # causal, past only; AUC 1/2/4/6 words = .80/.86/.89/.91
    # How much of a word's score is its OWN tilt rather than that running
    # mean.
    emphasis_blend: 0.75
    # Pitch excursion above the speaker's running median, in dB of ratio.
    pitch_gain: 1.0
    length_gain: 0.0   # lengthening, per character; off
    percentiles: [10, 95]
    # Tilt's own units, and NOT db_min_span.
    min_span: 12.0
    deadband: 0.72   # only clearly-elevated effort lifts
  # Local learned segmentation + speaker embeddings for live attribution.
  diarization:
    enabled: true
    # auto = native Core ML Sortformer on Apple Silicon, else the ONNX
    # embedding path. A failed native start degrades; it never aborts captions.
    backend: auto
    model: assets/speaker-embedding-en/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
    segmentation_model: assets/speaker-segmentation-en/model.int8.onnx
    num_threads: 2
    segmentation_num_threads: 2
    # Used only if the learned segmentation model is missing.
    change_below: 0.25     # adjacent-window cosine below this = turn boundary
    # RAISED 6 -> 12 (2026-08-02).
    max_speakers: 12
    window_s: 1.0
    hop_s: 1.0             # non-overlap: do not smear both sides of a turn
    sortformer:
      executable: native/sortformer/.build/release/autocwi-sortformer
      cache_dir: assets/sortformer-coreml
      startup_timeout_s: 120
      # FluidAudio preset.
      preset: fastV2_1
      # fp16 weights instead of the 6-bit palettized ones.
      fp16: false
      # Require real overlap with the word; missed quiet speech falls back to
      # the endpoint embedding tracker rather than being forced onto a slot.
      min_word_coverage: 0.24
      # Bound endpoint synchronization.
      endpoint_wait_ms: 90
  # Tunable engineering defaults, not scientifically validated constants.
  speaker_attribution:
    min_enrollment_duration_s: 0.8  # clean speech required to create/update a profile
    min_assignment_duration_s: 0.25 # shorter spans stay unknown or continuity-only
    stable_after_observations: 2    # repeated clean observations make a profile stable
    # ...OR one observation at least this long.
    stable_after_duration_s: 1.1
    # S1/S2 stay low latency.
    immediate_speaker_limit: 2
    # Raw ERes2Net cosine similarities, not calibrated probabilities.
    assignment_threshold: 0.33      # confident match to an enrolled speaker
    provisional_threshold: 0.20     # short but well-separated matches may be tentative
    new_speaker_threshold: 0.30     # below this, a long clean span may enroll a voice
    centroid_ema_alpha: 0.15        # weight of a clean observation in centroid EMA
    switch_hysteresis_s: 0.35       # challenger persistence required before switching
    short_turn_max_duration_s: 1.1  # weak short turns prefer recent-speaker continuity
    retain_threshold: 0.32          # separate lower threshold for retaining current voice
    switch_threshold: 0.33          # separate higher threshold for switching voices
    min_confidence_margin: 0.08
    # A LONE WORD MAY NOT CHANGE SPEAKER MID-UTTERANCE (2026-08-03).
    speaker_min_run_words: 3
    # Clean short replies score below full-turn cosine thresholds even with
    # a good embedding model.
    short_stable_threshold: 0.18
    short_stable_min_margin: 0.12
    short_stable_max_duration_s: 1.3
    min_signal_quality: 0.25        # optional 0..1 update-quality floor
    # THE RATIO BETWEEN THE VOICE ALGORITHM AND THE DIRECTION SENSOR, 0..1.
    # The blend in `_score` is confidence = (1 - w) * embedding + w * direction,
    # so this is the direction sensor's SHARE of a speaker-match decision:
    # 0 = voice only (the shipped default), 0.5 = equal, up to 0.90.
    # WHY IT EXISTS: on real spontaneous speech the voice embedding flickers --
    # measured on Korean dialogue, 18% of words are attributed to one speaker
    # mid-turn and CORRECTED at the endpoint, because a short segment matches
    # the wrong enrolled voice confidently. The mic array's bearing fails
    # DIFFERENTLY -- it is steady across a turn -- so weighting it up trades the
    # embedding's flicker for the array's angular error. ONLY BITES WITH THE
    # ARRAY ATTACHED: on a local mic or a file there is no bearing and the blend
    # is skipped, so this does nothing without the hardware node. Pin it per
    # session with `--direction-trust`. Left low by default because it is
    # UNMEASURED against two real simultaneous talkers (no labelled array
    # recording yet); raise it at the booth and watch the compass.
    direction_trust: 0.05
    # Deprecated alias, still read if `direction_trust` is absent.
    direction_prior_weight: 0.05
    # HOW LONG A BEARING STAYS VALID AFTER THE ARRAY STOPS REPORTING ONE.
    # The board publishes a bearing only while it hears speech, so direction
    # arrives in bursts, not continuously. MEASURED 2026-09-07 off the live SSE
    # with the array attached: direction was present on 48% of speech-marked
    # events, and the dropouts ran a MEDIAN of 1.41s with a max of 3.97s -- so
    # at the old hardcoded 1.5s, 3 of 9 gaps expired and `direction_deg` went
    # absent mid-conversation. That is the "goes off and on" the booth sees.
    # This is a FRESHNESS knob, not a smoothing one: every extra second is a
    # second the ring can point at somebody who already stopped talking, and
    # `autocwi/haptics.py` drives motors from it. The compass holds its last
    # needle independently of this, so raise it for the DATA (attribution,
    # haptics), never to make the display look calmer.
    # 0 = NEVER EXPIRES: direction detection is always on, holding the last
    # measured bearing until a new one replaces it (set 2026-09-07, at the
    # user's request). A positive value expires it after that many seconds.
    doa_ttl_s: 0
    # Colour an undecided word from its bearing instead of leaving it grey
    # (the SpeechCompass approach, CHI '25).
    direction_slot_colouring: true
    # Bearings within this many degrees are the same speaker.
    direction_identity: true
    # A bearing is this speaker's within this many of THEIR OWN standard
    # deviations, so a tightly-placed talker is matched strictly.
    direction_match_sigma: 2.0
    # Before a speaker's band may name anybody.
    direction_min_observations: 4
    # ...AND DIRECTION MAY CONTEST A WEAK VOICE DECISION.
    direction_override_below: 0.45
    direction_slot_tolerance_deg: 35
    provisional_color_strength: 0.55 # speaker-color share in tentative word color
    # STABILITY MODE for real spontaneous speech (default OFF). When on, a
    # mid-stream word is never given a NEW specific speaker: only a `stable`
    # decision or a continuation of the active speaker paints, otherwise the
    # word waits grey for the endpoint. Kills "wrong colour -> right colour"
    # flips in favour of "grey -> right colour". MEASURED on real Korean
    # dialogue it more than halved flicker on one clip (7.5% -> 3.4%) and barely
    # moved another (18.2% -> 17.7%) -- a partial win, not a fix -- and its cost
    # in first-paint correctness is UNMEASURED (no labelled data). Where the mic
    # array is present, `direction_trust` is the better tool. Off by default so
    # the shipped behaviour is unchanged.
    readahead_stability: false
    debug: false                    # add decision details and print session metrics
    # MID-UTTERANCE VERIFICATION WAS BUILT, MEASURED AND REMOVED
    # (2026-08-04).
  sound_events:
    enabled: true
    model: assets/audio-tagging-en/model.int8.onnx
    labels: assets/audio-tagging-en/class_labels_indices.csv
    num_threads: 2
    top_k: 5
    window_s: 2.0            # trailing audio classified each hop
    hop_s: 0.5               # how often the tagger runs
    min_conf: 0.35           # prob needed to OPEN a segment (chip appears)
    end_conf: 0.20           # prob needed to sustain it (hysteresis < min_conf)
    hold_s: 0.6              # keep open this long after it drops (no strobing)
    min_gap_s: 0.8           # re-trigger guard per category
    suppress:                # AudioSet classes the ASR owns — never a chip
      - Speech
      - Conversation
      - Narration, monologue
      - Babbling
    categories:
      vocal:
        - Laughter
        - Giggle
        - Snicker
        - Chuckle, chortle
        - Baby laughter
        - Belly laugh
        - Sigh
        - Gasp
        - Cough
        - Throat clearing
        - Sneeze
        - Sniff
        - Breathing
        - Crying, sobbing
        - Whimper
        - Groan
        - Screaming
        - Whistling
        # WIDENED 2026-08-13.
        - Yell
        - Shout
        - Bellow
        - Whoop
        - Battle cry
        - Children shouting
        - Screech
        - Wail, moan
        - Grunt
        - Yawn
        - Hiccup
        - Burping, eructation
        - Snoring
        - Gargling
        - Humming
        - Whimper (dog)
      reaction:
        - Applause
        - Clapping
        - Cheering
        - Crowd
        - Booing
        - Chatter
        - Hubbub
        - Children playing
        - Crowd noise
        - Whistle
        - Finger snapping
        - Cheer
      music:
        - Music
        - Musical instrument
        - Singing
        - Choir
        - Guitar
        - Piano
        - Drum
        - Trumpet
        - Violin
        - Song
        - Bass guitar
        - Electric guitar
        - Acoustic guitar
        - Keyboard (musical)
        - Synthesizer
        - Organ
        - Flute
        - Saxophone
        - Cello
        - Harp
        - Chime
        - Wind chime
        - Music box
        - Theme music
        - Background music
        - Jingle (music)
        - Christmas music
        - Musical ensemble
      environmental:
        - Door
        - Knock
        - Doorbell
        - Telephone
        - Ringtone
        - Telephone bell ringing
        - Alarm
        - Siren
        - Vehicle horn
        - Car alarm
        - Dog
        - Bark
        - Bell
        # The booth and the room.
        - Slam
        - Cupboard open or close
        - Drawer open or close
        - Sliding door
        - Squeak
        - Footsteps
        - Walk, footsteps
        - Water
        - Pour
        - Glass
        - Chink, clink
        - Shatter
        - Beep, bleep
        - Buzzer
        - Alarm clock
        - Smoke detector, smoke alarm
        - Fire alarm
        - Air horn, truck horn
        - Reversing beeps
        - Typing
        - Computer keyboard
        - Writing
        - Camera
        - Printer
        - Microwave oven
        - Blender
        - Vacuum cleaner
        - Engine
        - Motor vehicle (road)
        - Train
        - Aircraft
        - Helicopter
        - Thunder
        - Thunderstorm
        - Rain
        - Wind
        - Explosion
        - Gunshot, gunfire
        - Fireworks
        - Cat
        - Meow
        - Bird
        - Bird vocalization, bird call, bird song
  # Quiet speech produced no captions at all: the transducer stops emitting
  # well below its training level. This gains only the RECOGNIZER's copy --
  # prosody keeps measuring the true level, so a whisper still renders small.
  input_gain:
    enabled: true
    target_dbfs: -26.0       # RMS the recognizer is driven toward
    min_gain_db: 0.0
    max_gain_db: 30.0
    initial_gain_db: 0.0
    floor_margin_db: 8.0     # speech must clear the noise floor by this much
    absolute_floor_db: -72.0 # below this the input counts as no signal
    floor_window_s: 6.0
    attack_db_per_s: 24.0    # shed gain fast so a loud passage cannot clip
    release_db_per_s: 6.0    # add gain slowly so the level does not pump
    acquire_db_per_s: 60.0   # first convergence, so the opening words survive
    headroom_dbfs: -1.0
    level_event_period_s: 0.12
  # Settings for the optional legacy `live --whisper MODEL` pause segmenter.
  silence_db: -42          # fallback threshold when adaptive is off / warming up
  adaptive_silence: true   # track the noise floor so music beds don't block cuts
  min_silence_s: 0.4
  min_speech_s: 0.25
  max_utterance_s: 4.0

# Closed-caption playback (`autocwi cc spec.json`).
closed_caption:
  # CWI 2.2.1: a line is legible in white this long before its first word.
  read_ahead_s: 2.0
  line_hold_s: 1.2
  # How the colour turn crosses a word.
  sync_granularity: character
  # The template's travelling wave.
  neighbor_bleed: 0.34
  wave_reach: 1.0   # how far the character wave travels inside a word
  # FITTED TO THE THREE REFERENCE RECORDINGS in docs/.
  wave_crouch_em: 0.052       # how far BELOW the baseline before the turn
  wave_crouch_lead_s: 0.22    # when the crouch begins
  wave_release_s: 0.18        # peak -> rest; measured fall 160-190 ms
  # A word waits RAISED until it is spoken, however long that takes; this
  # caps it.
  wave_hold_max_s: 0.90
  wave_peak_s: 0.08           # peak lands this long AFTER the colour turn
  # The template's +2 against its -(5 + amp): the dip is ~13% of the lift.
  anticipation_dip_em: 0.04

  # TWO COMPOSABLE SYSTEMS, not one generic text wave.
  emphasis_lead_s: 0.18       # 120-220 ms before the spoken onset
  quiet_deformation: 1.0   # the below-baseline side of the envelope
  # CWI reads as uniform type with only OCCASIONAL emphasis.
  emphasis_deadband: 0.05
  weight_deadband: 0.12   # ink-density deviation before weight moves
  weight_full_dev: 0.55
  emphasis_hold_s: 0.08
  emphasis_tail_s: 0.30       # 200-400 ms after the peak
  # 2.
  wave_lift_em: 0.41
  wave_hold_floor: 0.18       # fraction of the rise a just-in-time word gets
  wave_hold_full_s: 0.70      # wait at which the rise is full
  # Per-character SCALE is off.
  wave_dip: 0.0               # scale while approaching
  wave_pop: 0.132             # size bloom just after the turn
  pop_release_s: 0.29
  pop_peak_s: 0.11
  # 2.2.3 GUIDING THE EYE WITH MOTION.
  sync_pop: 0.15              # +15% type size at the turn, then back (2.2.3)
  sync_elevation_em: 0.25     # 25% elevation at the turn, then back (2.2.3)
  # Shape only: the PDF gives the amplitudes, the recordings give the timing.
  sync_rise_s: 0.09
  sync_peak_s: 0.08
  sync_fall_s: 0.18
  # spec - the model above, with per-word amplitude from measured prosody.
  motion_source: spec
  # Film reference: ONE tight centred line at a time, not a transcript.
  max_lines: 1
  # 0 = never break a line on WORD COUNT.
  max_words: 0
  # The baked `motion.lift` channel is in GLYPH HEIGHTS, the unit the
  # recordings are measured in.
  glyph_height_em: 0.70
  debug_churn: false          # counts style writes per frame; window.__ccChurn
  # Horizontal tracking, measured off the reference recordings.
  tracking:
    enabled: false
    playhead_pct: 50.0
    interp: monotone_cubic
    coast_s: 0.18
    handoff_s: 0.36
    catch_up_s: 0.20
    enter_offset_pct: 32.0
    exit_offset_pct: -32.0
  # Resting type size, % of frame height.
  size_response: 1.0          # no compression; the reference uses the full range
  # 2.3.9 maps the whole Roboto Flex weight axis over the human vocal range:
  # 80 Hz -> 1000, 160-200 Hz -> Regular 400, 250 Hz and above -> 100.
  wght_range: [100, 1000]
  anchor_wght: [380, 420]     # 2.3.8: Regular 400 for a 160-200 Hz voice
  # 2.3.5: normal speaking volume is 5% of the screen height.
  size_pct: 5.0

mapping:
  # Volume -> type size (2.3.3-2.3.6). Unit = % of video height.
  loudness_to: { axis: size, min: 3, max: 12, baseline: 5, unit: pct_video_height }
  # Pitch -> weight (2.3.7-2.3.10).
  pitch_to: { axis: wght, min: 100, max: 1000, invert: true, domain_hz: [80, 250] }
  # 2.3.7-2.3.10 pairs weight with the width axis: rich low harmonics read
  # wider, thin high ones condensed.
  harmonics_to: { axis: wdth, min: 25, max: 150, invert: true, domain_hz: [80, 250] }
  speaker_to: color

# How much of each measured per-word deviation actually reaches the type.
expression:
  # The film reference reads as a normal-weight sans with uniform colour and
  # only occasional emphasis.
  size_response: 0.42
  weight_response: 0.16
  width_response: 0.16
  # Running window of recent voiced words defining "normal for this speaker".
  baseline_words: 12
  # Typography eases between words instead of snapping (2.2.3 is continuous
  # motion; nothing in CWI cuts).
  transition_ms: 190

  # The axes are CUMULATIVE.
  smoothing_words: 5
  # A legibility clamp on the RESTING anchors -- a documented deviation.
  anchor_wght: [340, 430]
  # Hard bounds on the RENDERED axes.
  wght_range: [280, 500]
  wdth_range: [85, 115]
  anchor_wdth: [88, 112]
  hysteresis: 0.35
  # Live ladder.
  size_steps: [2.6, 3.1, 3.6, 4.4, 6]
  weight_step: 100
  width_step: 25

normalization:
  # Per-speaker percentile range mapped to 0..1 (robust to outliers).
  low_percentile: 5
  high_percentile: 95
  min_voiced_frac: 0.2   # below this a word holds the speaker's baseline

# Haptic salience. Cues fire on the speaker_change / emphasis flags, never on
# every word and never on raw direction -- continuous vibration from a DoA
# stream is what *Tactile Emotions* (CHI '25) measured as distracting.
haptics:
  emphasis_db: 6.0    # word this far above the speaker's median dB = emphatic

  # Overall actuation strength, 0..1.
  intensity: 0.8

  # The motor ring on the Pi, BCM pin numbers, CLOCKWISE FROM THE CASE'S
  # FRONT. GPIO4 is LEFT (270°); GPIO27 is RIGHT (90°).
  motors:
    - gpio: 4
      angle_deg: 270
    - gpio: 27
      angle_deg: 90
  # Each motor covers ±135°, deliberately overlapping through the front and
  # rear so a two-motor prototype does not switch direction abruptly.
  motor_gate_deg: 135

asr:
  model: small          # base | small | medium
  beam_size: 5
  temperature: 0.0      # deterministic decoding

diarization:
  model: pyannote/speaker-diarization-3.1

prosody:
  pitch_floor_hz: 75
  pitch_ceiling_hz: 500

render:
  font_path: assets/RobotoFlex.ttf   # fetched by scripts/fetch_font.py
  korean_font_path: assets/NotoSansKR.ttf

seed: 42
